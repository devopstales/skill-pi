version: "3"

vars:
  AGENT_DIR:
    sh: echo "${SKILL_PI_AGENT_DIR:-$HOME/.skill-pi/agent}"
  WORK_DIR:
    sh: echo "${SKILL_PI_WORK_DIR:-$HOME/.skill-pi/work}"

tasks:
  install:
    desc: "Install skill-pi globally (npm link) and verify"
    cmds:
      - npm install
      - npm ci
      - npm link --force
      - 'echo "skill-pi installed: $(which skill-pi)"'
      - 'echo "agent dir: {{.AGENT_DIR}}"'
      - 'echo "work dir:  {{.WORK_DIR}}"'

  uninstall:
    desc: "Uninstall skill-pi (--force to also wipe ~/.skill-pi)"
    cmds:
      - npm unlink -g skill-pi 2>/dev/null || true
      - npm uninstall -g skill-pi 2>/dev/null || true
      - '{{ if .FORCE }}rm -rf "{{.AGENT_DIR}}" "{{.WORK_DIR}}"; echo "wiped agent dir and work dir"{{ end }}'
      - 'echo "uninstalled; $(command -v skill-pi 2>/dev/null || echo "skill-pi removed from PATH")"'
    vars:
      FORCE:
        sh: '[ "$1" = "--force" ] && echo true || echo false'

  clean:
    desc: "Remove node_modules and local .pi artifacts"
    cmds:
      - rm -rf node_modules .pi
    status:
      - test ! -d node_modules

  test:
    desc: "Run test suite"
    cmds:
      - node --test "test/**/*.test.js"

  providers:test:
    desc: "Run unified providers extension tests"
    cmds:
      - node --test "test/providers.*.test.js"

  pack:
    desc: "Create a .tgz package for inspection"
    cmds:
      - npm pack

  publish:
    desc: "Publish both packages to GitHub Packages (extension first, then root)"
    deps: [test]
    cmds:
      - cd extensions/file-search && npm publish
      - npm publish
    preconditions:
      - test: test -n "$(npm config get //npm.pkg.github.com/:_authToken 2>/dev/null)"
        message: "No GitHub Packages auth found. Set GITHUB_TOKEN or //npm.pkg.github.com/:_authToken in ~/.npmrc"

  publish-dry-run:
    desc: "Dry-run both publishes to GitHub Packages (no upload)"
    cmds:
      - cd extensions/file-search && npm publish --dry-run
      - npm publish --dry-run

  all:
    desc: "Clean, install, test"
    cmds:
      - task: clean
      - task: install
      - task: test
